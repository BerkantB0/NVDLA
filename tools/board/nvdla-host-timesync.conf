# ZCU102 NVDLA direct-link time source.
# This trusts the Windows host at 192.168.50.1 for artifact timestamps.
# RootDistanceMaxSec is relaxed for Windows Time and is not suitable evidence
# for precision timing or accelerator performance measurements.
[Time]
NTP=192.168.50.1
FallbackNTP=
RootDistanceMaxSec=30
